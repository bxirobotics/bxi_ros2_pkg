name: Auto Package and Upload

on:
  push:
    branches: ["arm64"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ROBOT_MODEL: ELF3
  PACKAGE_NAME: bxi_ros2_pkg
  PACKAGE_TARGET_PATH: /opt/bxi/bxi_ros2_pkg

jobs:
  package-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Version Tag
        shell: bash
        run: |
          git fetch --force --tags
          TIME_TAG=$(date +'%y%m%d')
          BASE_TAG="v${TIME_TAG}"
          VERSION="${BASE_TAG}"
          if git tag -l "${BASE_TAG}" | grep -qx "${BASE_TAG}"; then
            SUFFIX=1
            while git tag -l "${BASE_TAG}-${SUFFIX}" | grep -qx "${BASE_TAG}-${SUFFIX}"; do
              SUFFIX=$((SUFFIX + 1))
            done
            VERSION="${BASE_TAG}-${SUFFIX}"
          fi
          echo "tag_name=${VERSION}" >> "$GITHUB_ENV"

      - name: Write Package Metadata
        shell: bash
        run: |
          sudo mkdir -p /opt/bxi
          sudo rm -rf "${PACKAGE_TARGET_PATH}"
          sudo mkdir -p "${PACKAGE_TARGET_PATH}"
          sudo rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '*.tar.gz' \
            --exclude '*.tar.gz.sha256' \
            ./ "${PACKAGE_TARGET_PATH}/"
          printf '%s\n' "${{ env.tag_name }}" | sudo tee "${PACKAGE_TARGET_PATH}/.version" >/dev/null
          sudo chmod 444 "${PACKAGE_TARGET_PATH}/.version"

      - name: Package Artifact
        shell: bash
        run: |
          ARTIFACT="${PACKAGE_NAME}_${{ env.tag_name }}.tar.gz"
          tar -czvf "${ARTIFACT}" -C /opt/bxi "${PACKAGE_NAME}"
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bxi_ros2_pkg_package
          path: |
            bxi_ros2_pkg_${{ env.tag_name }}.tar.gz
            bxi_ros2_pkg_${{ env.tag_name }}.tar.gz.sha256
          retention-days: 7

      - name: SCP Upload Package Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: bxi_ros2_pkg_${{ env.tag_name }}.tar.gz,bxi_ros2_pkg_${{ env.tag_name }}.tar.gz.sha256
          target: ${{ secrets.DEPLOY_PATH }}/arm64/bxi_ros2_pkg
